<!-- 
  Example Wazuh Agent Configuration for Windows
  Showcasing File Integrity Monitoring (FIM)
-->

<ossec_config>
  <!-- 
    The syscheck block controls File Integrity Monitoring (FIM)
  -->
  <syscheck>
    <!-- By default it is disabled. Set to yes to enable. -->
    <disabled>no</disabled>

    <!-- Frequency that syscheck is executed default every 12 hours -->
    <frequency>43200</frequency>
    
    <!-- 
      Showcases checking a specific important directory in real-time.
      report_changes="yes" will show the exact text that was added/removed in the Wazuh alert.
    -->
    <directories check_all="yes" realtime="yes" report_changes="yes">C:\Users\Admin\ImportantFiles</directories>

    <!-- Ignore specific temporary files inside monitored directories -->
    <ignore>C:\Users\Admin\ImportantFiles\temp.txt</ignore>
    <ignore type="sregex">.log$|.tmp$</ignore>

    <!-- 
      Windows registry monitoring examples.
      Alerts when important registry keys are modified.
    -->
    <windows_registry>HKEY_LOCAL_MACHINE\Software\Classes\batfile</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\Software\Classes\cmdfile</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\Software\Classes\comfile</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\Software\Classes\exefile</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\Software\Classes\piffile</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\Software\Classes\regfile</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\Software\Classes\scrfile</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\Software\Classes\vbsfile</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Session Manager\KnownDLLs</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\SecurePipeServers\winreg</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\RunOnce</windows_registry>
  </syscheck>
</ossec_config>
